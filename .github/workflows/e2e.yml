name: E2E

# Admin Playwright specs on a fixture store built from public sources (Magento mirror, module-base from Packagist,
# OpenImport main or the ref given). The fixture's SFTP and HTTP file services run as containers next to the store.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:
    inputs:
      openimport_ref:
        description: openimport branch to install (empty = .github/ci/openimport-ref, else main)
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright · Magento 2.4.9
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MAGENTO_ROOT: /var/www/magento
      DB_HOST: 127.0.0.1
      DB_NAME: magento
      DB_USER: magento
      DB_PASSWORD: magento
      ADMIN_USER: openimport
      ADMIN_PASSWORD: OpenImport-e2e-2026
      BASE_URL: http://localhost
      OI_FIXTURE: shell
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: magento
          MARIADB_USER: magento
          MARIADB_PASSWORD: magento
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=10s --health-retries=10
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ['9200:9200']
      redis:
        image: redis:7.2
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7

      - name: Fixture file services (SFTP, HTTP)
        run: |
          # A key pair for the private-key login; the server knows the public key, the spec pastes the private one.
          ssh-keygen -q -t ed25519 -N '' -C openimport-e2e -f "$RUNNER_TEMP/sftp_key"
          chmod 644 "$RUNNER_TEMP/sftp_key.pub"
          echo "SFTP_KEY_FILE=$RUNNER_TEMP/sftp_key" >> "$GITHUB_ENV"
          docker run -d --name sftp -p 2222:22 -v "$PWD/fixtures/files:/home/openimport/fixtures:ro" \
            -v "$RUNNER_TEMP/sftp_key.pub:/home/openimport/.ssh/keys/e2e.pub:ro" \
            atmoz/sftp:alpine openimport:openimport-sftp:1001:1001:out
          docker run -d --name files -p 8081:80 -v "$PWD/fixtures/files:/usr/share/nginx/html:ro" \
            -v "$PWD/.warden/files.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/.warden/files.htpasswd:/etc/nginx/files.htpasswd:ro" nginx:1.27-alpine
          sleep 3
          curl -fsS http://localhost:8081/stock-de.csv
          curl -fsS -u openimport:openimport-http http://localhost:8081/private/products-small.csv

      - name: S3-compatible server (RustFS) with a bucket and a product file
        run: |
          # MinIO publishes no images any more; RustFS speaks the S3 API with Signature V4.
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=openimport -e RUSTFS_SECRET_KEY=openimport-s3-secret \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/)" != "000" ] && break; sleep 2; done
          export AWS_ACCESS_KEY_ID=openimport AWS_SECRET_ACCESS_KEY=openimport-s3-secret AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url http://localhost:9000 s3 mb s3://openimport-e2e
          aws --endpoint-url http://localhost:9000 s3 cp fixtures/files/products-small.csv s3://openimport-e2e/feeds/products-small.csv
          aws --endpoint-url http://localhost:9000 s3 ls s3://openimport-e2e/feeds/
          echo "OI_S3=http://localhost:9000|openimport|openimport-s3-secret|openimport-e2e" >> "$GITHUB_ENV"

      - name: PHP 8.3, nginx
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq php8.3-fpm php8.3-cli php8.3-bcmath php8.3-curl php8.3-gd php8.3-intl \
            php8.3-mbstring php8.3-mysql php8.3-soap php8.3-xml php8.3-zip nginx
          sudo update-alternatives --set php /usr/bin/php8.3
          for ini in /etc/php/8.3/cli/php.ini /etc/php/8.3/fpm/php.ini; do
            sudo sed -i 's/^memory_limit = .*/memory_limit = 4G/; s/^;*realpath_cache_size = .*/realpath_cache_size = 10M/' "$ini"
          done
          sudo sed -i "s/^user = www-data/user = runner/; s/^group = www-data/group = runner/" /etc/php/8.3/fpm/pool.d/www.conf
          sudo mkdir -p "$MAGENTO_ROOT" && sudo chown runner:runner "$MAGENTO_ROOT"
          php -v

      - name: OpenImport ref
        # workflow_dispatch input, else .github/ci/openimport-ref (a stacked branch while OpenImport's PRs are open),
        # else main.
        run: |
          ref="${{ inputs.openimport_ref }}"
          if [ -z "$ref" ] && [ -s .github/ci/openimport-ref ]; then ref="$(tr -d '[:space:]' < .github/ci/openimport-ref)"; fi
          echo "OPENIMPORT_REF=${ref:-main}" >> "$GITHUB_ENV"
          echo "OpenImport ref: ${ref:-main}"

      - name: Fixture store
        run: .github/ci/logged.sh "Fixture store" ci/install-fixture.sh

      - name: Google API stand-in (Drive, token endpoint)
        # OpenImport's own mock of Google's API (from its integration tests), with a service account key made here and
        # a folder that holds the small product file; the store's Google endpoints point to it (app/etc/di.xml).
        run: |
          folder=1E2eFixtureFolderAbcdefghijklmn
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/google.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/google.pem" -pubout -out "$RUNNER_TEMP/google.pub"
          php -r '
            $folder = $argv[1]; $temp = $argv[2];
            $content = file_get_contents("fixtures/files/products-small.csv");
            file_put_contents("$temp/google-state.json", json_encode(["public_key" => file_get_contents("$temp/google.pub"),
              "files" => ["fileE2eProducts0000000000001" => ["name" => "products-small.csv", "mimeType" => "text/csv",
              "parents" => [$folder], "modifiedTime" => gmdate("Y-m-d\TH:i:s.000\Z"), "content" => $content]],
              "sessions" => [], "requests" => []]));
            file_put_contents("$temp/google-key.json", json_encode(["type" => "service_account",
              "client_email" => "e2e@openimport-e2e.iam.gserviceaccount.com",
              "private_key" => file_get_contents("$temp/google.pem"), "token_uri" => "http://127.0.0.1:8090/token"]));
          ' "$folder" "$RUNNER_TEMP"
          OPENIMPORT_GOOGLE_STATE="$RUNNER_TEMP/google-state.json" nohup php -S 127.0.0.1:8090 \
            "$MAGENTO_ROOT/vendor/iranimij/openimport/Test/Integration/_files/google-server.php" > "$RUNNER_TEMP/google.log" 2>&1 &
          sleep 2
          sed -i 's#</config>#    <type name="Iranimij\\OpenImport\\Model\\Google\\GoogleEndpoints">\n        <arguments>\n            <argument name="authorize" xsi:type="string">http://127.0.0.1:8090/auth</argument>\n            <argument name="token" xsi:type="string">http://127.0.0.1:8090/token</argument>\n            <argument name="drive" xsi:type="string">http://127.0.0.1:8090/drive/v3</argument>\n            <argument name="upload" xsi:type="string">http://127.0.0.1:8090/upload/drive/v3</argument>\n        </arguments>\n    </type>\n</config>#' "$MAGENTO_ROOT/app/etc/di.xml"
          tail -12 "$MAGENTO_ROOT/app/etc/di.xml"
          (cd "$MAGENTO_ROOT" && bin/magento cache:flush > /dev/null)
          echo "OI_GOOGLE=$RUNNER_TEMP/google-key.json|$folder" >> "$GITHUB_ENV"

      - name: Serve (nginx :80)
        run: |
          sudo tee /etc/nginx/sites-available/default > /dev/null <<NGINX
          upstream fastcgi_backend { server unix:/run/php/php8.3-fpm.sock; }
          server {
              listen 80;
              server_name localhost;
              set \$MAGE_ROOT $MAGENTO_ROOT;
              include $MAGENTO_ROOT/nginx.conf.sample;
          }
          NGINX
          sudo systemctl restart php8.3-fpm nginx
          curl -sS -o /dev/null -w 'admin %{http_code}\n' --max-time 300 http://localhost/admin

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
          ../.github/ci/logged.sh Playwright npx playwright test

      - name: Diagnostics
        if: failure()
        run: |
          # Specs write what they saw into playwright/diagnostics/*.txt; one notice each (readable through the API).
          for f in playwright/diagnostics/*.txt; do
            [ -f "$f" ] || continue
            echo "::notice title=$(basename "$f")::$(head -c 3800 "$f" | awk 'BEGIN{ORS=""}{gsub(/%/,"%25"); print $0 "%0A"}')"
          done
          tail -n 80 "$MAGENTO_ROOT/var/log/system.log" 2>/dev/null | awk 'BEGIN{ORS=""}{gsub(/%/,"%25"); print $0 "%0A"}' | sed 's/^/::notice title=system.log::/'; echo
          tail -n 60 "$MAGENTO_ROOT/var/log/openimport.log" 2>/dev/null | awk 'BEGIN{ORS=""}{gsub(/%/,"%25"); print $0 "%0A"}' | sed 's/^/::notice title=openimport.log::/'; echo
          grep -E "main.ERROR: OpenImport|iranimij/openimport/Model|module-catalog/Model|module-catalog-url-rewrite/(Model|Observer)" "$MAGENTO_ROOT/var/log/exception.log" 2>/dev/null | tail -n 40 | cut -c1-260 | awk 'BEGIN{ORS=""}{gsub(/%/,"%25"); print $0 "%0A"}' | sed 's/^/::notice title=exception.log::/'; echo
          # One notice per failed test with its first error (the job log tail only shows the last failure).
          node -e '
            const r = require("./playwright/test-results.json"); const out = [];
            const walk = (s) => { for (const p of s.specs || []) for (const t of p.tests || []) for (const x of t.results || []) if (x.status === "failed" || x.status === "timedOut") out.push([p.title, (x.errors || []).map((e) => e.message || "").join("\n--\n").replace(/\x1b\[[0-9;]*m/g, "").slice(0, 3000)]); for (const c of s.suites || []) walk(c); };
            for (const s of r.suites || []) walk(s);
            for (const [t, m] of out) console.log("::notice title=" + t.replace(/[%:\n]/g, " ").slice(0, 120) + "::" + m.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A"));
          ' 2>/dev/null || true
          # Run folders: which files each run read and wrote (first bytes), and the run rows.
          { for d in "$MAGENTO_ROOT"/var/openimport/runs/*/; do
              [ -d "$d" ] || continue; echo "== $d"; ls -la "$d"
              for f in "$d"*; do [ -f "$f" ] && { echo "-- $(basename "$f")"; head -c 300 "$f" | tr -d '\r'; echo; }; done
            done
            mysql -h 127.0.0.1 -u magento -pmagento magento -e 'SELECT run_id, profile_id, status, mode, source_file, LEFT(message, 300) AS message FROM openimport_run ORDER BY run_id' 2>/dev/null
          } | head -c 3800 | awk 'BEGIN{ORS=""}{gsub(/%/,"%25"); print $0 "%0A"}' | sed 's/^/::notice title=runs::/'; echo

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright
          path: |
            playwright/playwright-report
            ${{ env.MAGENTO_ROOT }}/var/log
          retention-days: 14
